model:
  slug: "claude-haiku-4-5"
  temperature: 1

paths:
  cric_db: "./ipl.db"                    
  cric_gold: "./queries.json"            
  bird_dev: "./bird/dev.json"      
  bird_databases: "./bird/dev_databases"
  outputs: "./outputs"
  dk_prompt_cric: "../../IPL/dk_prompt_ipl.sql"

  odi_db: "../../wc.db"
  odi_gold: "../../ODI/odi_queries_combined.json"
  dk_prompt_odi: "../../ODI/dk_prompt_odi.sql"

  t20i_db: "../../t20_I.db"
  t20i_gold: "../../T20/t20I_dataset_cricbench.json"
  dk_prompt_t20i: "../../T20/dk_prompt_t20i.sql"

  test_db: "../../tests.db"
  test_gold: "../../Test/gold_dataset_test_final_corrected_updated.json"
  dk_prompt_test: "../../Test/dk_prompt_test.sql"

bird:
  subset_size: 400        # N=400 per spec
  seed: 42                # Stratified by db_id, seed 42
  stratify_by: "db_id"    # Stratification column

timeouts:
  claude_subprocess_sec: 120     # Per call timeout
  sql_execution_sec: 20          # SQLite interrupt timeout

# CricBench languages
# Each base question gets evaluated in 4 languages
cric_languages:
  - english
  - hindi
  - telugu
  - punjabi

# Retry logic
retry:
  max_attempts: 3
  backoff_factor: 2.0  # exponential backoff

# Bootstrap CI
bootstrap:
  n_resamples: 10000
  seed: 42
  alpha: 0.05  # 95% CI
